
name: Publish to PyPI or TestPyPI

# Pre-releases publish to TestPyPI and run an automated verification.
# Promoting a pre-release to a full release (or creating one directly)
# publishes to PyPI — but only after a safety check confirms the version
# was previously published to TestPyPI.
on:
  release:
    types: [prereleased, released]

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python3 -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  # ── TestPyPI (pre-releases only) ─────────────────────────────────

  publish-to-testpypi:
    if: ${{ github.event.release.prerelease }}
    name: Publish to TestPyPI
    needs: build-package
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/afcharts

    permissions:
      id-token: write  # mandatory for trusted publishing (OIDC)

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI installation
    needs: publish-to-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install from TestPyPI (with retries)
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for ATTEMPT in 1 2 3; do
            echo "Attempt ${ATTEMPT}: installing afcharts==${PACKAGE_VERSION} from TestPyPI..."
            if pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "afcharts==${PACKAGE_VERSION}"; then
              echo "✅ Successfully installed afcharts==${PACKAGE_VERSION}"
              exit 0
            fi
            echo "⏳ Waiting 30s for TestPyPI index to update..."
            sleep 30
          done
          echo "❌ Failed to install afcharts==${PACKAGE_VERSION} from TestPyPI after 3 attempts"
          exit 1

      - name: Verify import
        run: python -c "import afcharts; print('✅ afcharts imported successfully')"

  # ── PyPI (full releases only) ─────────────────────────────────────

  check-testpypi:
    if: ${{ !github.event.release.prerelease }}
    name: Safety check — verify version was tested on TestPyPI
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check TestPyPI for matching version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Strip PEP 440 pre-release suffixes to get the base version
          BASE=$(echo "$PACKAGE_VERSION" | sed -E 's/(a|b|rc|\.dev|\.post)[0-9]*$//')
          echo "Checking TestPyPI for afcharts versions matching '${BASE}'..."

          if ! curl -sf "https://test.pypi.org/pypi/afcharts/json" -o /tmp/testpypi.json; then
            echo "❌ Could not fetch package info from TestPyPI."
            echo "Either the package has never been published there, or TestPyPI is unavailable."
            exit 1
          fi

          python3 - "$BASE" /tmp/testpypi.json <<'CHECKEOF'
          import json, sys

          base = sys.argv[1]
          with open(sys.argv[2]) as f:
              data = json.load(f)

          releases = list(data.get("releases", {}).keys())
          matching = [v for v in releases if v == base or v.startswith(base)]

          if matching:
              print(f"✅ Found matching version(s) on TestPyPI: {matching}")
          else:
              print(f"❌ No version matching '{base}*' found on TestPyPI.")
              print(f"   Available versions: {releases}")
              print("Publish and verify a pre-release on TestPyPI before publishing to PyPI.")
              sys.exit(1)
          CHECKEOF

  publish-to-pypi:
    if: ${{ !github.event.release.prerelease }}
    name: Publish to PyPI
    needs:
      - build-package
      - check-testpypi
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/afcharts

    permissions:
      id-token: write  # mandatory for trusted publishing (OIDC)

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true